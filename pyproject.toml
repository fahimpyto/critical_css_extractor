[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "critical-css-extractor"
version = "1.0.0"
description = "Extract critical above-the-fold CSS to improve Core Web Vitals and SEO."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
]
authors = [
    { name = "Critical CSS Extractor" },
]

[project.scripts]
critical-css = "main:main"

[tool.setuptools.packages.find]
where = ["."]
